services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metin2_warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - metin2-postgres:/var/lib/postgresql/data
      - ./sql/constellation_schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metin2_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  metin2-postgres:
